# The Chengzi PRO layer: every `dsh-plugin-chengzi-*` row this fork mounts on
# the web surface lives in this ONE file, listed after `./cordis.patch.yml` in
# `package.json` `dsh.bundle.patch` (before the agent presets). Adding a chengzi
# plugin to the bundle is two lines: a `workspace:*` dependency row in this
# package's `dependencies`, and one `insert` entry below.
#
# Rows here register on the HOST plane, so their tools land in the tools
# registry's global layer and every agent preset's sessions see them without
# per-preset edits. Plugin policy defaults live in each plugin's own Config
# schema; override them here per row if a deployment ever needs to.

- insert:
    # generate_image: per-call platform image generation billed to the
    # signed-in account, with a cost/resolution confirmation card (approval
    # intent); the platform key resolves per call through the credential seam.
    - id: chengzi-image
      name: 'dsh-plugin-chengzi-image'
    # account: BFF 登录/充值/会话、平台 provider/钥匙按计费组分组同步、
    # 默认模型钦定（deepseek-v4.1-flash 优先）、设置页（账号/关于）与登录门。
    - id: chengzi-account
      name: 'dsh-plugin-chengzi-account'
    # experts: BFF 专家目录物化+agentPresets 挂载、技能包同步、云端我的专家、
    # footer 入口+专家 main 面板+会话 dock 身份卡（host 面；client 面在
    # cordis.patch.yml 浏览器 roster 的 chengzi-experts 行）。
    - id: chengzi-experts
      name: 'dsh-plugin-chengzi-experts'
    # aoci: 会话工作区内运行 aoci-code CLI（status/capabilities/scan/init/
    # verify 等白名单子命令），仓库认知索引读写；host 面单行即可（无 client 面）。
    - id: chengzi-aoci
      name: 'dsh-plugin-chengzi-aoci'
    # hzcfjt: 海珠城发集团定制工作汇报 PPT 生成（generate_hzcfjt_ppt），
    # 客户五章节模板 + 审定原版固定头部（assets/hzcfjt-head.pptx）；host 面。
    - id: chengzi-hzcfjt
      name: 'dsh-plugin-chengzi-hzcfjt'
    # reader: 微信公众号文章读取（read_wechat_article）——客户把公众号当
    # 素材库（PPT/写作引用）；桌面宽带 IP + 真实浏览器头天然过微信反爬。
    - id: chengzi-reader
      name: 'dsh-plugin-chengzi-reader'

# ── 橙子PRO v3：平台生态锁定与默认模型兜底（H 追加层） ────────────────────────
# 以下为按 id 覆盖/预置的顶层 patch 条目（loader 语义：后层覆盖先层、整组
# config 替换、禁用行不带 config）。本文件禁止 js 表达式标签（!! 双感叹号
# +js 的 YAML tag）——部署版打包时无法求值，v2 旧教训。

# v1 红线（锁定平台生态）：禁用基座官方 DeepSeek 对话路由两条——
# `deepseek-official`（API key 适配器，DEEPSEEK_API_KEY）与 `deepseek-account`
# （官方账号 token 适配器）。对话模型只由 chengzi-account 目录同步注入的
# llm-pi-ai「chengzi-platform*」分组路由供给。base 的 `deepseek-account`
# 账号基建行（dsh-deepseek-account-platform）不动：桌面壳层账号栈仍依赖。
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# 默认会话模型兜底初值（首装/目录同步前生效；此后由 chengzi-account 的
# provider-sync 维护 settings `agent-default-model` 命名空间动态接管）。
# provider 必须用 provider-sync 的分组路由名：默认/vip 组 =
# CHENGZI_PROVIDER_ROUTE「chengzi-platform」（多组路由为
# chengzi-platform-<组slug>，见 packages/chengzi/account/src/provider-sync.ts
# 的 chengziGroupProviderRoute）；model = 运营钦定的 deepseek-v4.1-flash
# （2026-09-23 拍板：默认别用 free 打底）。整组 config 替换，两个键都要写全。
- id: agent-default-model
  config:
    provider: chengzi-platform
    model: deepseek-v4.1-flash

