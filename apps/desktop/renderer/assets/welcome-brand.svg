<text x="52" y="30" fill="var(--dsw-alias-label-primary)" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="1">橙子PRO</text>
